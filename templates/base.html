<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AIFormation{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <span class="logo">🤖</span>
                <span class="brand-name">AIFormation</span>
            </div>
            <ul class="nav-menu">
                <li><a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Dashboard</a></li>
                <li><a href="{{ url_for('docs') }}" class="nav-link {% if request.endpoint == 'docs' or request.endpoint == 'doc_detail' %}active{% endif %}">Documentatie</a></li>
                <li><a href="{{ url_for('sprints') }}" class="nav-link {% if request.endpoint == 'sprints' or request.endpoint == 'sprint_detail' or request.endpoint == 'task_detail' %}active{% endif %}">Sprints</a></li>
                <li><a href="{{ url_for('scripts') }}" class="nav-link {% if request.endpoint == 'scripts' %}active{% endif %}">Scripts</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2024 AIFormation - AI-Driven Development Orchestration</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
